name: Build 808 KILLA

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: build\tests\K808Tests_artefacts\Release\K808Tests.exe

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --verbose --output-dir pluginval-logs --validate "build\K808_artefacts\Release\VST3\808 KILLA.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload pluginval logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs-windows
          path: pluginval-logs/

      - name: Installer (Inno Setup)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(K808_KILLA VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\win\808killa.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload VST3
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: 808-KILLA-VST3-Windows
          path: build/K808_artefacts/Release/VST3/

      - name: Upload installer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: 808-KILLA-Installer-Windows
          path: build/installer/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        run: ./build/tests/K808Tests_artefacts/Release/K808Tests

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/K808_artefacts/Release/AU/808 KILLA.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aufx K808 Kila

      - name: pluginval (strictness 10)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --validate "build/K808_artefacts/Release/VST3/808 KILLA.vst3"

      - name: Installer (pkg, unsigned)
        if: ${{ !cancelled() }}
        run: |
          VERSION=$(sed -n 's/project(K808_KILLA VERSION \([0-9.]*\))/\1/p' CMakeLists.txt)
          installer/mac/build_pkg.sh "$VERSION"

      - name: Upload plugins
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: 808-KILLA-macOS
          path: |
            build/K808_artefacts/Release/VST3/
            build/K808_artefacts/Release/AU/

      - name: Upload installer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: 808-KILLA-Installer-macOS
          path: build/installer/*.pkg
