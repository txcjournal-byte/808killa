name: Release build (Windows + macOS, full validation)

# Full build with tests, pluginval, auval and installers. Run manually
# (Actions > Release build > Run workflow) or by pushing a version tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: build\tests\K808Tests_artefacts\Release\K808Tests.exe

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # stderr lines are printed as text (pwsh would otherwise abort the step on them)
          & .\pluginval\pluginval.exe --strictness-level 10 --verbose --output-dir pluginval-logs --validate "build\K808_artefacts\Release\VST3\808 KILLA.vst3" 2>&1 | ForEach-Object {
            if ($_ -is [System.Management.Automation.ErrorRecord]) { "[stderr] $($_.ToString())" } else { "$_" }
          }
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host ("pluginval exit code: {0} (0x{1:X8})" -f $code, $code)
            Write-Host "=== Windows event log (crashes) ==="
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001, 1026 } -MaxEvents 6 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message
            Write-Host "=== pluginval crash file ==="
            Get-Content "$env:TEMP\pluginval_crash.txt" -ErrorAction SilentlyContinue
            Write-Host "=== pluginval logs ==="
            Get-ChildItem pluginval-logs -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName | Select-Object -Last 60 }
            exit 1
          }

      - name: Crash dump analysis (only when pluginval failed)
        if: failure()
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile procdump.zip
          Expand-Archive procdump.zip -DestinationPath procdump
          New-Item -ItemType Directory -Force dumps | Out-Null
          for ($run = 1; $run -le 3; $run++) {
            Write-Host "=== attempt $run ==="
            .\procdump\procdump64.exe -accepteula -ma -e 1 -f C0000005 -f C0000409 -f C00000FD -f C0000374 -x dumps .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --validate "build\K808_artefacts\Release\VST3\808 KILLA.vst3" | Select-String -Pattern "Starting tests|Exception|Dump|FAILED|SUCCESS"
            if (Get-ChildItem dumps\*.dmp -ErrorAction SilentlyContinue) { break }
          }
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          $sym = (Resolve-Path "build\K808_artefacts\Release\VST3\808 KILLA.vst3\Contents\x86_64-win").Path
          foreach ($d in Get-ChildItem dumps\*.dmp) {
            Write-Host "=== DUMP $($d.Name) ==="
            & $cdb -z $d.FullName -y "$sym;srv*" -c ".ecxr;kb 60;.echo ===ALL THREADS===;~*kb 20;q" | Select-Object -Last 250
          }
          exit 0

      - name: Upload pluginval logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs-windows
          path: pluginval-logs/

      - name: Installer (Inno Setup)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(K808_KILLA VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\win\808killa.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload VST3
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: 808-KILLA-VST3-Windows
          path: build/K808_artefacts/Release/VST3/

      - name: Upload installer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: 808-KILLA-Installer-Windows
          path: build/installer/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        run: ./build/tests/K808Tests_artefacts/Release/K808Tests

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/K808_artefacts/Release/AU/808 KILLA.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aufx K808 Kila

      - name: pluginval (strictness 10)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --validate "build/K808_artefacts/Release/VST3/808 KILLA.vst3"

      - name: Installer (pkg, unsigned)
        if: ${{ !cancelled() }}
        run: |
          VERSION=$(sed -n 's/project(K808_KILLA VERSION \([0-9.]*\))/\1/p' CMakeLists.txt)
          installer/mac/build_pkg.sh "$VERSION"

      - name: Upload plugins
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: 808-KILLA-macOS
          path: |
            build/K808_artefacts/Release/VST3/
            build/K808_artefacts/Release/AU/

      - name: Upload installer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: 808-KILLA-Installer-macOS
          path: build/installer/*.pkg
