name: Build 808 KILLA (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: 808-KILLA-VST3-Windows
          path: build/K808_artefacts/Release/VST3/

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: 808-KILLA-Standalone-Windows
          path: build/K808_artefacts/Release/Standalone/*.exe
